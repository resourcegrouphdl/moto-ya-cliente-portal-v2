name: Deploy portal-cliente a Firebase Hosting (prod)

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # El apiKey de Firebase no es secreto por diseño (ver src/lib/firebase.ts):
          # la seguridad real la dan las Security Rules + Firebase Auth.
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDSm_NM4QShVmIhd_5SpJT2WG9tz4h6LLQ
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: motoya-form.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: motoya-form
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: motoya-form.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "26647667439"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:26647667439:web:388dce55f64aac6115f11a"
          NEXT_PUBLIC_GATEWAY_BASE_URL: https://moto-ya-gateway-26647667439.us-central1.run.app

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOTOYA_FORM }}
          projectId: motoya-form
          target: portal-cliente
          channelId: live
